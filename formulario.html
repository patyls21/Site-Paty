<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22012a">
<title>Lançar gasto · Nosso Controle</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('nc-tema')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="manifest" href="manifest-formulario.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261018b">
</head>
<body class="solo">
<header class="barra">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4 2.3h4C14.6 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg><span>Lançar gasto</span></div>
  <div class="barra-bt">
    <a class="icon" href="index.html" title="Abrir o painel completo" aria-label="Painel completo">📊</a>
    <button class="icon js-tema" aria-label="Alternar tema">☀️</button>
    <button class="icon js-sair" aria-label="Sair" hidden>⎋</button>
  </div>
</header>
<div id="aviso-fatura" hidden></div>
<main id="main"></main>
<p class="sub" style="text-align:center;font-size:.72rem;margin:6px 0 0">versão 20261018b</p>

<!-- elementos que o app.js espera (não aparecem neste formulário) -->
<div hidden>
  <span id="crumb"></span><span id="h-titulo"></span><span id="h-sub"></span><button id="cta"></button>
  <span id="data"></span><span id="user"></span><span id="avatar"></span><span id="f-dados"></span>
</div>

<dialog id="dlg"></dialog>
<div id="login" hidden>
  <form id="login-form">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4 2.3h4C14.6 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg><span>Nosso Controle</span></div>
    <div class="login-abas"><button type="button" class="on" data-modo="entrar">Entrar</button><button type="button" data-modo="criar">Pedir acesso</button></div>
    <label id="l-nome" hidden>Seu nome<input name="nome" type="text" autocomplete="name"></label>
    <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" minlength="6" required></label>
    <p id="login-erro" role="alert"></p>
    <button class="btn" type="submit" id="login-ok">Entrar</button>
  </form>
  <div id="espera" hidden>
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2 0 3.4 1.1 4 2.3h4C14.6 6.1 16 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg><span>Nosso Controle</span></div>
    <h2>Aguardando liberação ⏳</h2>
    <p>Sua conta foi criada, mas ainda precisa ser liberada por um administrador. Avise quem cuida do site e depois toque em verificar.</p>
    <p id="espera-erro" role="alert"></p>
    <button class="btn" id="espera-ver" type="button">Já fui liberado, verificar</button>
    <button class="btn sec" id="espera-sair" type="button">Sair</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=20261018b"></script>
<script src="js/util.js?v=20261018b"></script>
<script src="js/store.js?v=20261018b"></script>
<script src="js/app.js?v=20261018b"></script>
<script src="js/lancar.js?v=20261018b"></script>
<script src="js/avisos.js?v=20261018b"></script>
<script src="js/viagens.js?v=20261018b"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
<script>App.iniciar().catch(e => { console.error(e); alert('Erro ao iniciar: ' + e.message); });</script>
</body>
</html>
