name: Lembrei! enviar mensagens

# A cada 10 minutos vê se há algum aviso na hora e manda pelo WhatsApp (lembrei/enviar.mjs).
# Manual: Actions > Lembrei! enviar mensagens > Run workflow (pode preencher "teste_para" com o nome de um contato).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      teste_para:
        description: 'Nome do contato para mandar uma mensagem de teste (deixe vazio para o envio normal)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lembrei
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enviar
        env:
          LEMBREI_CONTATOS: ${{ secrets.LEMBREI_CONTATOS }}
          WHATSAPP_PROVIDER: ${{ vars.WHATSAPP_PROVIDER }}
          META_PHONE_ID: ${{ secrets.META_PHONE_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_TEMPLATE: ${{ vars.META_TEMPLATE }}
          TESTE_PARA: ${{ inputs.teste_para }}
        run: node lembrei/enviar.mjs

      - name: Guardar o que já foi enviado
        if: always()
        run: |
          if [ -n "$(git status --porcelain lembrei/data/estado.json)" ]; then
            git config user.name "lembrei-bot"
            git config user.email "lembrei-bot@users.noreply.github.com"
            git add lembrei/data/estado.json
            git commit -m "Lembrei: registro de envios"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
