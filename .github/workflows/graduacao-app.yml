name: Montar app Minha Graduação

# Monta o aplicativo "Minha Graduação" (arquivo .apk) e publica na página de Releases.
# Roda sozinho quando algo em graduacao/ ou graduacao-app/ muda, ou manualmente em Actions > Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - 'graduacao/**'
      - 'graduacao-app/**'
      - '.github/workflows/graduacao-app.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar o site para dentro do app
        run: |
          mkdir -p graduacao-app/app/src/main/assets
          cp -r graduacao/. graduacao-app/app/src/main/assets/

      - name: Montar o APK
        working-directory: graduacao-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Nomear o arquivo
        run: cp graduacao-app/app/build/outputs/apk/debug/app-debug.apk minha-graduacao.apk

      - name: Publicar na página de Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-graduacao
          name: App Minha Graduação
          body: Aplicativo Android do Minha Graduação. Baixe o arquivo minha-graduacao.apk e instale no celular.
          files: minha-graduacao.apk

      - name: Guardar o APK (para testes fora da main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: minha-graduacao-apk
          path: minha-graduacao.apk
